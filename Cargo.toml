[package]
name = "settings_updater"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[lib]
name = "settings_updater"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "temp"
path = "src/main.rs"

[dependencies]
ctor = "0.6.1"
dirs-next = "2.0.0"
indexmap = "2.12.0"
regex = "1.12.2"
xml-rs = "1.0.0"
